<!doctype html>
<html lang="en">
  <head>
    <!-- Poster QR codes link to /?p=N ("Learn more") and /get?p=N ("Get the
         app"), where N is the poster design. Short links keep the QR codes
         simple; this expands them into UTM tags before the Google tag reads
         the URL, so Analytics reports each design as its own campaign. -->
    <script>
      (function () {
        var url = new URL(location.href);
        var design = url.searchParams.get("p");
        if (!design || !/^[0-9]{1,2}$/.test(design)) return;
        var getApp = url.pathname.replace(/\/+$/, "") === "/get";
        url.searchParams.delete("p");
        url.searchParams.set("utm_source", "wwu_poster");
        url.searchParams.set("utm_medium", getApp ? "qr_get_app" : "qr_learn_more");
        url.searchParams.set("utm_campaign", "wwu_campus_poster_" + design);
        history.replaceState(null, "", url);
        // Remembered for the session so store links on the page carry it too.
        try { sessionStorage.setItem("kovePosterDesign", design); } catch (e) {}
      })();
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9N56L1KNJL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9N56L1KNJL');
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Kove for WWU Students</title>
    <meta
      name="description"
      content="Kove is a budgeting app for iPhone, Android, and the web. The first 25 WWU students get free full access with code WWUVIKINGS."
    />
    <meta name="theme-color" content="#eaf5f4" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
